# Full stack: PostgreSQL + FastAPI backend (ChromaDB embedded) + Next.js frontend.
#   cp .env.example .env   # then set GEMINI_API_KEY, JWT_SECRET, ADMIN_* and POSTGRES_PASSWORD
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://chatbot:${POSTGRES_PASSWORD}@db:5432/chatbot
      CHROMA_DIR: /app/data/chroma
      STORAGE_DIR: /app/data/documents
      ENVIRONMENT: production
    volumes:
      - backend_data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  backend_data:
